<!--
  Synxia lockup horizontal: estrella + SYNXIA. Variante para FONDO OSCURO.

  5-sep-2026. Este archivo NO se dibujo aqui: los dos vectores estan COPIADOS
  de synxia-marketing/components/sitio/Marca.tsx, que a su vez los trae del
  LOGOTIPO.ai de Karla. Son los mismos trazos que la landing.

  Lo que habia antes era OTRA marca: una ese enroscada (dos arcos) y "Synxia"
  en minusculas compuesto en Fraunces. Nunca se actualizo, y llevaba en
  produccion, en el login, todo este tiempo. El repintado de #463 le cambio el
  color a esa marca vieja; esto la reemplaza.

  Ninguna de nuestras herramientas caza esto. Para el auditor de contraste y
  para el detector de maquetacion, un logotipo equivocado es una imagen que
  esta donde debe. Solo lo ve alguien que sepa como debe verse la marca.

  Colores: los del catalogo (vendor/synxia-tokens/tokens.css). Van LITERALES
  porque el SVG se sirve como imagen desde /public, fuera de toda hoja de
  estilo: una var() no resolveria.
    simbolo  #FF7D00  = token color-accion
    palabra  #FFFFFF  = token color-fondo-elevado (fondo OSCURO)

  OJO: la landing pinta la palabra en #E8E9ED, un valor que el catalogo NO
  tiene. La diferencia es minima pero real y la decide Karla, no este archivo.

  Proporcion: la del nav de la landing (sitio.module.css:115-116), estrella
  25x16 + hueco 11 + palabra 104x15, escalada x10.

  OJO al editar: los nombres de token NO se escriben con doble guion aqui
  arriba. Un doble guion dentro de un comentario XML es invalido y deja el
  roto en las once pantallas que lo usan; paso el 5-sep-2026 y ninguna cifra
  lo caza. Validar con un parser XML antes de dar por bueno.
-->
